<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GD Alternator Trainer</title>
<style>
:root{
  --bg:#f5f7fa;--panel:#ffffff;--panel2:#f0f3f8;--line:#dde2ec;--text:#1b2233;--mute:#5f6b82;
  --acc:#2563eb;--L:#2563eb;--R:#d97706;--good:#16a34a;--bad:#dc2626;--warn:#d97706;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=range]{padding:0;width:100%}
h1,h2,h3{margin:0 0 .4em}
header{position:sticky;top:0;z-index:5;background:var(--panel);box-shadow:0 1px 2px rgba(16,24,40,.04);border-bottom:1px solid var(--line)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px}.brand span{color:var(--acc)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:none;background:transparent;color:var(--mute);padding:6px 12px}
nav button.on{background:var(--panel2);color:var(--text)}
main{padding:20px 0 60px}
.view{display:none}.view.on{display:block}
.card{box-shadow:0 1px 3px rgba(16,24,40,.06);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.mute{color:var(--mute)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.space{flex:1}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mute)}
.tag.good{color:var(--good);border-color:var(--good)}.tag.lock{opacity:.6}
.pips{display:flex;gap:5px}.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}.pip.on{background:var(--good);border-color:var(--good)}
.lvl.locked{opacity:.5}
.lvl.current{border-color:var(--acc)}
.stat{background:var(--panel2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}
details p,details li{color:#2d3750}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 8px;background:var(--panel2);font-family:monospace}
canvas{width:100%;display:block;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}
.ok{color:var(--good)}.no{color:var(--bad)}
/* drill overlay */
#drill{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;overflow:auto}
#drill.on{display:flex}
#drill .inner{max-width:760px;width:100%;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.hud{display:flex;gap:18px;flex-wrap:wrap}.hud div{min-width:70px}.hud b{font-size:22px;display:block;line-height:1.1}
#msg{text-align:center;min-height:26px;color:var(--mute)}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:170px}
.pad button{font-size:34px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;border-width:2px;transition:background .06s}
.pad button small{display:block;font-size:13px;font-weight:400;color:var(--mute)}
#padL{border-color:var(--L);color:var(--L)}#padR{border-color:var(--R);color:var(--R)}
#padL.hit{background:rgba(37,99,235,.3)}#padR.hit{background:rgba(217,119,6,.3)}
.pad button.bad{background:rgba(220,38,38,.35)}
#result{display:none}
#result.on{display:block}
.insight{padding:8px 12px;border-left:3px solid var(--acc);background:var(--panel2);border-radius:6px;margin:6px 0}
.insight.warn{border-color:var(--warn)}.insight.good{border-color:var(--good)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12px;margin:0 4px 4px 0}
.tag.mini{color:#7c3aed;border-color:#7c3aed}
.flaw{margin:8px 0}
@media(max-width:560px){nav button{padding:6px 8px;font-size:14px}}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="brand">GD <span>Alternator</span> Trainer</div>
  <nav id="nav"></nav>
</div></header>

<main class="wrap">
  <section id="view-path" class="view"></section>
  <section id="view-learn" class="view"></section>
  <section id="view-practice" class="view"></section>
  <section id="view-wave" class="view"></section>
  <section id="view-tools" class="view"></section>
  <section id="view-stats" class="view"></section>
  <section id="view-settings" class="view"></section>
</main>

<div id="drill"><div class="inner">
  <div class="row"><b id="dName"></b><span class="space"></span><button id="dStop" class="ghost">Stop &amp; score</button><button id="dQuit" class="ghost">Quit</button></div>
  <div class="hud">
    <div><span class="mute small">Time</span><b id="hTime">0.0</b></div>
    <div><span class="mute small">Taps</span><b id="hTaps">0</b></div>
    <div><span class="mute small">CPS now</span><b id="hCps">0.0</b></div>
    <div><span class="mute small">Double-hits</span><b id="hDbl">0</b></div>
  </div>
  <canvas id="stage" height="200"></canvas>
  <div id="msg"></div>
  <div class="pad" id="pad">
    <button id="padL">L<small id="kL"></small></button>
    <button id="padR">R<small id="kR"></small></button>
  </div>
  <div id="result" class="card"></div>
</div></div>

<script>
'use strict';
/* ============================== storage ============================== */
const KEY='gdalt_v1';
const DEF={keys:['KeyF','KeyJ'],offset:0,vol:0.6,sessions:[],prog:{},days:[],best:0};
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));return Object.assign({},DEF,o||{},{keys:(o&&o.keys)||DEF.keys.slice()});}catch(e){return JSON.parse(JSON.stringify(DEF));}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const f1=v=>(Math.round(v*10)/10).toFixed(1);
const pct=v=>Math.round(v*100);
function keyName(c){const m={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Space:'Space',ShiftLeft:'L-Shift',ShiftRight:'R-Shift',ControlLeft:'L-Ctrl',ControlRight:'R-Ctrl'};
  return m[c]||c.replace(/^Key/,'').replace(/^Digit/,'').replace(/^Numpad/,'Num ');}
const today=()=>new Date().toISOString().slice(0,10);

/* ============================== content ============================== */
const LESSONS=[
{t:'1. What alternating is (and why it works)',b:`<p>In Geometry Dash, <b>alternating</b> means clicking with two fingers in turn (or two keys/buttons) instead of tapping with one finger. One finger tops out around 6–8 CPS for most people; two fingers taking turns can reach 10–14+ CPS because each finger only has to tap half as often.</p>
<p>The goal isn't just speed. Spam sections in GD (wave spam, ship/UFO/cube spam) punish <em>uneven</em> clicks. A steady 8 CPS beats a shaky 11 CPS. This tool trains <b>consistency first, speed second</b>.</p>`},
{t:'2. Setup: fingers, keys, posture',b:`<ul>
<li><b>Keyboard:</b> pick two keys your fingers reach without moving your hand (index + middle on two neighbouring keys is common). Set them in Settings. The trainer defaults to <span class="kbd">F</span> and <span class="kbd">J</span> so you can practise one finger per hand first.</li>
<li><b>Same key, two fingers:</b> many players alternate index/middle on <em>one</em> key or on a mouse button. To train that, bind both trainer keys to neighbouring keys, then move to the real game once it feels natural.</li>
<li><b>Mouse:</b> index + middle on left click is the classic "mouse alternate." Use the on-screen L/R pads with two fingers on a touch screen to practise the rhythm.</li>
<li><b>Posture:</b> forearm supported, wrist neutral and relaxed, fingers hovering just above the keys. Tension is the enemy of speed.</li>
</ul>`},
{t:'3. Finger mechanics',b:`<ul>
<li>Use <b>small, fast motions</b> from the knuckle, not the whole arm.</li>
<li>Think "<b>down-up-down-up</b>": one finger rises as the other falls, like a see-saw.</li>
<li>Keep the fingers light. Don't slam keys; bottoming out wastes time.</li>
<li>Fingers should never hit the same key twice in a row. The trainer counts these as <b>double-hits</b>.</li>
<li>If one finger is clearly weaker (see the L/R balance in your analysis), spend extra drills on slow, exact taps with that finger leading.</li>
</ul>`},
{t:'4. Rhythm before speed',b:`<p>Your brain needs to learn <em>even spacing</em>. Start with the <b>Metronome Lock</b> drill at a comfortable 3 CPS. Each beat is one tap, and the hands alternate. Aim to land <em>on</em> the click, not after it.</p>
<ul><li>If your average error is negative you're rushing; positive means you're dragging.</li>
<li>Only raise the tempo when you hit ≥85% of beats on time at the current tempo.</li></ul>`},
{t:'5. Building speed safely',b:`<p>Use the <b>ladder method</b>: find the tempo where you can stay ≥85% on-beat. Practise there for a few rounds, then go +0.5 CPS. If accuracy collapses, drop back half a step and repeat. Short bursts (<em>Sprint</em> drill) teach your hands what fast feels like; metronome and endurance drills make it reliable.</p>
<p>Never train through pain, numbness or tingling. Stop, shake out your hands, and rest.</p>`},
{t:'6. Endurance and relaxation',b:`<p>Real spam sections last 5–20 seconds. The <b>drift</b> number in your analysis compares the first and second half of a run: a big positive number means you slow down (tensing up), a big negative one means you panic-speed. Keep shoulders down, breathe, and stay loose.</p>`},
{t:'7. Taking it into Geometry Dash',b:`<ul>
<li>Practise in-game with <b>Practice Mode</b> on a spam section at reduced speed (or a custom level with a slow wave) before full speed.</li>
<li>In the wave, clicks are in/out of hold. A steady tempo keeps the wave flat. The <b>Wave Control</b> drill simulates this: each tap flips direction, so even rhythm keeps you centred in a shrinking corridor.</li>
<li>Match the click speed to the segment. Often you need less than your max; consistency at 70% of your top CPS is ideal.</li>
<li>Game timing runs on physics ticks, so <em>evenly spaced</em> clicks matter more than peak speed.</li>
<li>Warm up with 2–3 minutes of the daily session before attempting hard spam sections.</li>
</ul>`},
{t:'8. Troubleshooting',b:`<ul>
<li><b>One finger dominates / double hits:</b> slow down to half speed and exaggerate the see-saw motion.</li>
<li><b>Speeds up then chokes:</b> you're tensing. Lower the tempo and aim for long, relaxed runs.</li>
<li><b>Uneven intervals (high variation):</b> use the metronome more, and less free-tapping.</li>
<li><b>Fingers colliding or sliding:</b> move the keys a bit apart or adjust hand angle.</li>
<li><b>Plateau:</b> train at 80% of max for accuracy one day, sprints the next.</li>
</ul>`},
{t:'9. Steering the wave and spam types',b:`<p>In the wave simulator every tap flips direction (up/down) at constant speed. So:</p>
<ul><li><b>Even taps = flat line.</b> A steady rhythm zigzags in place. Faster taps make a smaller zigzag, which is how you fit tight corridors.</li>
<li><b>Steering = uneven gaps.</b> To drift <em>up</em>, let the up-gap run a little longer than the down-gap. To drift down, do the opposite. You do this by slight timing changes, not by pausing.</li>
<li><b>Mini waves</b> are steeper and live in tighter corridors, so the zigzag is taller and you need quicker, smaller taps.</li></ul>
<p><b>Spam types in the Academy:</b> Straight (pure speed), Diagonal (slow steering), Staircase (quick re-centre), Wavy (continuous steering), Tempo-shift (speed up and down as the corridor tightens and loosens), and Gauntlet (all of them chained).</p>
<p>The coach reads why you crash (double-hits, uneven rhythm, too slow, or bad steering) and adds assists such as strict alternation mode or a guide beat, then removes them as you improve.</p>`},
{t:'10. A simple practice plan',b:`<ol><li>Do the <b>Daily Session</b> (Practice tab), about 5 minutes.</li>
<li>Work the current level on the Path until you pass it the required number of times <em>in a row</em>.</li>
<li>Check Analysis weekly: is your rating, consistency and L/R balance improving?</li>
<li>Take rest days. Short daily practice beats long occasional grinds.</li></ol>`}
];

const LEVELS=[
 {id:'basics',name:'Two-Finger Basics',focus:'Alternate cleanly: no double-hits.',need:2,lesson:2,
  drill:{type:'free',name:'Basics: 8s free alternate',dur:8},pass:{cps:3,alt:0.9}},
 {id:'beat',name:'Find the Beat',focus:'Land taps on a slow metronome.',need:2,lesson:3,
  drill:{type:'metro',name:'Find the Beat (3 CPS)',cps:3,beats:24},pass:{hit:0.8,mae:60}},
 {id:'smooth',name:'Smooth Speed',focus:'Reach 5 CPS with even spacing.',need:3,lesson:4,
  drill:{type:'free',name:'Smooth Speed: 10s',dur:10},pass:{cps:5,cv:0.3,alt:0.92}},
 {id:'lock',name:'Metronome Lock',focus:'Stay locked to the beat at 5 CPS.',need:3,lesson:3,
  drill:{type:'metro',name:'Metronome Lock (5 CPS)',cps:5,beats:32},pass:{hit:0.85,mae:45}},
 {id:'endure',name:'Endurance',focus:'Hold 6 CPS for 15s without fading.',need:3,lesson:5,
  drill:{type:'free',name:'Endurance: 15s',dur:15},pass:{cps:6,cv:0.25,drift:0.15}},
 {id:'wave',name:'Wave Control',focus:'Survive the shrinking wave corridor.',need:3,lesson:8,
  drill:{type:'wave',name:'Wave Control: 20s',dur:20,wave:{kind:'sine',size:'big',diff:0.4,mode:'level'}},pass:{survive:20}},
 {id:'ready',name:'GD Ready',focus:'7+ CPS, steady and clean, for 12s.',need:3,lesson:6,
  drill:{type:'free',name:'GD Ready: 12s',dur:12},pass:{cps:7,cv:0.22,alt:0.95}}
];
function levelState(id){return S.prog[id]||(S.prog[id]={streak:0,done:false});}
function currentLevel(){for(let i=0;i<LEVELS.length;i++)if(!levelState(LEVELS[i].id).done)return i;return LEVELS.length;}

/* ============================== analysis ============================== */
function analyze(taps){
  const n=taps.length,r={n,cps:0,cv:1,alt:0,dbl:0,dur:0,ints:[],hands:taps.map(t=>t.h),drift:0,lMean:0,rMean:0,mean:0,sd:0};
  if(n<3)return r;
  let altOk=0,ints=[];
  for(let i=1;i<n;i++){ints.push(taps[i].t-taps[i-1].t);if(taps[i].h!==taps[i-1].h)altOk++;else r.dbl++;}
  r.ints=ints;r.dur=(taps[n-1].t-taps[0].t)/1000;
  r.cps=r.dur>0?(n-1)/r.dur:0;
  const mean=ints.reduce((a,b)=>a+b,0)/ints.length;
  const sd=Math.sqrt(ints.reduce((a,b)=>a+(b-mean)**2,0)/ints.length);
  r.mean=mean;r.sd=sd;r.cv=sd/mean;r.alt=altOk/ints.length;
  const half=Math.floor(ints.length/2);
  if(half>=2){const m1=avg(ints.slice(0,half)),m2=avg(ints.slice(half));r.drift=(m2-m1)/m1;}
  const L=[],R=[];for(let i=1;i<n;i++)(taps[i].h===0?L:R).push(ints[i-1]);
  r.lMean=L.length?avg(L):0;r.rMean=R.length?avg(R):0;
  return r;
}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function scoreOf(r){
  if(r.n<5)return 0;
  return clamp(r.cps/8,0,1)*35+clamp(1-(r.cv-0.08)/0.32,0,1)*40+clamp((r.alt-0.7)/0.3,0,1)*25;
}
function tierOf(s){return s<25?'Beginner':s<45?'Rookie':s<60?'Steady':s<75?'Skilled':s<88?'Advanced':'Master';}
function rating(){
  const xs=S.sessions.filter(s=>s.type!=='wave'&&s.score>0).slice(-15).map(s=>s.score).sort((a,b)=>b-a).slice(0,5);
  return xs.length?avg(xs):0;
}
function insights(r,cfg){
  const out=[];const add=(k,t)=>out.push({k,t});
  if(r.n<5){add('warn','Too few taps to analyse. Try again and keep tapping for the whole drill.');return out;}
  if(r.dbl>0&&r.alt<0.9)add('warn',`${r.dbl} double-hit${r.dbl>1?'s':''}: you tapped the same hand twice in a row (${pct(r.alt)}% alternation). Slow down and exaggerate the see-saw motion.`);
  else if(r.alt>=0.97)add('good','Very clean alternation.');
  if(r.lMean&&r.rMean){const d=(r.rMean-r.lMean)/((r.rMean+r.lMean)/2);
    if(Math.abs(d)>0.08){const slow=d>0?'R':'L';add('warn',`Your ${slow} hand is about ${pct(Math.abs(d))}% slower. Drill slowly with the ${slow} hand leading and focus on matching its timing to the other.`);}
    else add('good','Both hands are well balanced.');}
  if(r.cv>0.3)add('warn',`Spacing is uneven (variation ${pct(r.cv)}%). Use the Metronome Lock drill at a comfortable speed to train rhythm.`);
  else if(r.cv<=0.15)add('good',`Excellent consistency (${pct(r.cv)}% variation).`);
  if(r.drift>0.12)add('warn',`You slowed down ~${pct(r.drift)}% through the run. Usually tension: relax the wrists and train longer runs at a lower tempo.`);
  else if(r.drift<-0.12)add('warn',`You sped up ~${pct(-r.drift)}% through the run. Try to hold the start tempo; don't rush.`);
  if(cfg.type==='metro'&&r.metro){
    add(r.metro.hit>=0.85?'good':'warn',`You hit ${pct(r.metro.hit)}% of beats within half a beat, with ${Math.round(r.metro.mae)}ms average error.`);
    if(Math.abs(r.metro.bias)>15)add('warn',r.metro.bias<0?`You tend to tap early by ~${Math.round(-r.metro.bias)}ms (rushing). Wait for the click.`:`You tend to tap late by ~${Math.round(r.metro.bias)}ms (dragging), or your audio latency is high. Adjust the offset in Settings.`);
  }
  if(cfg.type==='wave')add(r.survived>=cfg.dur?'good':'warn',r.survived>=cfg.dur?'You survived the whole corridor!':`You crashed after ${f1(r.survived)}s of ${cfg.dur}s.`);
  return out;
}

/* ============================== audio ============================== */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume();return AC;}
function clickAt(perfT,accent){
  const a=ac();if(!a)return;
  const when=a.currentTime+Math.max(0,(perfT-performance.now())/1000);
  const o=a.createOscillator(),g=a.createGain();
  o.frequency.value=accent?1500:1000;o.type='sine';
  g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(S.vol,when+0.002);g.gain.exponentialRampToValueAtTime(0.0001,when+0.06);
  o.connect(g);g.connect(a.destination);o.start(when);o.stop(when+0.08);
}

/* ============================== input ============================== */
let tapHandler=null,rebind=null;
document.addEventListener('keydown',e=>{
  if(rebind){e.preventDefault();if(e.code!=='Escape'){const other=S.keys[1-rebind.i];
      if(e.code===other){toast('Pick two different keys.');}else{S.keys[rebind.i]=e.code;save();}}
    rebind=null;renderSettings();return;}
  if(!tapHandler||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  const i=S.keys.indexOf(e.code);if(i<0)return;
  e.preventDefault();tapHandler(i,e.timeStamp||performance.now());
});
function bindPad(){
  [['padL',0],['padR',1]].forEach(([id,h])=>{
    const b=$('#'+id);
    b.addEventListener('pointerdown',e=>{e.preventDefault();if(tapHandler)tapHandler(h,e.timeStamp||performance.now());});
    b.addEventListener('contextmenu',e=>e.preventDefault());
    b.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter')e.preventDefault();});
  });
}
function flash(h,bad){
  const b=$(h===0?'#padL':'#padR');b.classList.add('hit');if(bad)b.classList.add('bad');
  setTimeout(()=>b.classList.remove('hit','bad'),70);
}
let toastT;function toast(m){const el=$('#msg');el.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>{if(el.textContent===m)el.textContent='';},2500);}

/* ============================== drill engine ============================== */
let D=null,raf=0;
const stage=$('#stage');const sctx=stage.getContext('2d');
function fitCanvas(c,h){const dpr=window.devicePixelRatio||1;const w=c.clientWidth;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.height=h+'px';}
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return {x,w,h};}

function openDrill(cfg,onDone){
  closeTools();
  D={cfg,onDone,state:'ready',taps:[],scored:[],dbl:0,t0:0,last:-1,data:{}};
  $('#dName').textContent=cfg.name;
  $('#kL').textContent=keyName(S.keys[0]);$('#kR').textContent=keyName(S.keys[1]);
  $('#result').classList.remove('on');$('#result').innerHTML='';
  $('#pad').style.display='';$('#dStop').style.display=(cfg.dur===0&&!cfg.taps)?'':'none';
  ['hTime','hTaps','hCps','hDbl'].forEach(i=>$('#'+i).textContent=i==='hTime'?'0.0':'0');
  $('#drill').classList.add('on');document.body.style.overflow='hidden';
  if(cfg.type==='metro'){
    const go=document.createElement('button');go.className='primary';go.textContent='Start metronome';go.id='goBtn';
    $('#msg').innerHTML='';$('#msg').append('Put your fingers on the keys, then ');$('#msg').append(go);
    go.onclick=()=>{go.remove();startMetro();};
    tapHandler=(h,t)=>{flash(h);};
  }else{
    $('#msg').textContent=cfg.type==='wave'?waveBrief(cfg):
      cfg.taps?`Tap ${cfg.taps} times as fast as you can, alternating. Timer starts on your first tap.`:'Alternate as evenly as you can. Timer starts on your first tap.';
    tapHandler=onTap;
  }
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function closeDrill(){
  cancelAnimationFrame(raf);tapHandler=null;D=null;stopMetroTool();
  $('#drill').classList.remove('on');document.body.style.overflow='';
}
$('#dQuit').onclick=()=>{const cb=D&&D.onQuit;closeDrill();if(cb)cb();renderAll();};
$('#dStop').onclick=()=>{if(D&&D.state==='run')finish();};

function startMetro(){
  ac();const iv=1000/D.cfg.cps,lead=4,total=lead+D.cfg.beats;
  const start=performance.now()+900;
  D.iv=iv;D.lead=lead;D.beats=[];
  for(let i=0;i<total;i++){const t=start+i*iv;D.beats.push(t);clickAt(t,i%2===0);}
  D.state='run';D.t0=start;D.data.hits=new Map();D.data.extra=0;D.data.marks=[];
  $('#msg').textContent='Count-in: 4 clicks, then tap on every click. Alternate hands.';
  tapHandler=onTap;
}
function onTap(h,t){
  if(!D||D.state==='done')return;
  const cfg=D.cfg;
  if(cfg.type==='metro'){
    if(D.state!=='run')return;
    if(t<D.beats[D.lead]-D.iv*0.6)return;       // during count-in
  }
  if(D.state==='ready'){D.state='run';D.t0=t;$('#msg').textContent='';if(cfg.type==='wave')waveInit();}
  const prev=D.taps[D.taps.length-1];
  const bad=prev&&prev.h===h;
  if(bad)D.dbl++;
  flash(h,bad);
  D.taps.push({t,h});
  if(cfg.type==='metro'){
    const adj=t-S.offset;
    const k=Math.round((adj-D.beats[0])/D.iv);
    if(k>=D.lead&&k<D.beats.length){
      const err=adj-D.beats[k];
      if(Math.abs(err)<D.iv*0.5){
        const old=D.data.hits.get(k);
        if(old===undefined||Math.abs(err)<Math.abs(old))D.data.hits.set(k,err);
        if(old!==undefined)D.data.extra++;
        D.data.marks.push({k,err,h});
      }else D.data.extra++;
    }
  }
  if(cfg.type==='wave'&&D.data.alive&&!(cfg.wave.strict&&bad))D.data.dir*=-1;
  if(cfg.taps&&D.taps.length>=cfg.taps)finish();
}
function liveCps(now){const w=2000,ts=D.taps.filter(x=>x.t>now-w);if(ts.length<2)return 0;return (ts.length-1)/((ts[ts.length-1].t-ts[0].t)/1000);}

function loop(){
  if(!D)return;const now=performance.now(),cfg=D.cfg;
  if(D.state==='run'){
    const el=(now-D.t0)/1000;
    if(cfg.type==='metro'){const endT=D.beats[D.beats.length-1]+D.iv*0.6;
      $('#hTime').textContent=f1(Math.max(0,(endT-now)/1000));if(now>endT)finish();}
    else if(cfg.type==='wave'){waveStep(now);$('#hTime').textContent=f1(D.data.t);}
    else if(cfg.dur){$('#hTime').textContent=f1(Math.max(0,cfg.dur-el));if(el>=cfg.dur)finish();}
    else $('#hTime').textContent=f1(el);
    if(D&&D.state==='run'){
      $('#hTaps').textContent=D.taps.length;$('#hCps').textContent=f1(liveCps(now));$('#hDbl').textContent=D.dbl;
    }
  }
  if(D&&D.state!=='done')drawStage(now);
  if(D)raf=requestAnimationFrame(loop);
}

/* ---- drawing ---- */
function drawStage(now){
  const {x,w,h}=fitCanvas(stage,D.cfg.type==='wave'?240:200);x.clearRect(0,0,w,h);
  const cfg=D.cfg;
  if(cfg.type==='metro'&&D.beats)drawMetro(x,w,h,now);
  else if(cfg.type==='wave')drawWave(x,w,h);
  else drawBars(x,w,h);
}
function drawBars(x,w,h){
  const ints=[];for(let i=1;i<D.taps.length;i++)ints.push({v:D.taps[i].t-D.taps[i-1].t,h:D.taps[i].h});
  const show=ints.slice(-50);
  x.fillStyle='#5f6b82';x.font='12px system-ui';x.fillText('Gap between taps (shorter bar = faster; aim for equal heights)',8,14);
  if(!show.length){x.fillText('Waiting for taps…',8,h/2);return;}
  const max=300,bw=w/50;
  show.forEach((it,i)=>{const bh=clamp(it.v/max,0,1)*(h-30);x.fillStyle=it.h===0?'#2563eb':'#d97706';x.fillRect(i*bw+1,h-bh,bw-2,bh);});
  const m=avg(show.map(s=>s.v));x.strokeStyle='#00000044';x.setLineDash([4,4]);x.beginPath();const my=h-clamp(m/max,0,1)*(h-30);x.moveTo(0,my);x.lineTo(w,my);x.stroke();x.setLineDash([]);
  x.fillStyle='#1b2233';x.fillText(Math.round(m)+'ms avg',w-80,my-4);
}
function drawMetro(x,w,h,now){
  const hitX=w*0.25,pxms=0.32;
  x.strokeStyle='#00000044';x.beginPath();x.moveTo(hitX,10);x.lineTo(hitX,h-10);x.stroke();
  x.font='bold 13px system-ui';x.textAlign='center';
  D.beats.forEach((bt,i)=>{
    const bx=hitX+(bt-now)*pxms;if(bx<-20||bx>w+20)return;
    const lead=i<D.lead;
    x.globalAlpha=lead?0.45:1;x.fillStyle=i%2===0?'#2563eb':'#d97706';
    x.beginPath();x.arc(bx,h/2,16,0,7);x.fill();x.fillStyle='#ffffff';x.fillText(i%2===0?'L':'R',bx,h/2+5);
    x.globalAlpha=1;
  });
  D.data.marks.slice(-30).forEach(m=>{
    const bx=hitX+(D.beats[m.k]-now)*pxms+m.err*pxms;if(bx<-20||bx>w+20)return;
    const good=Math.abs(m.err)<50;x.fillStyle=good?'#16a34a':Math.abs(m.err)<100?'#d97706':'#dc2626';
    x.fillRect(bx-2,h/2-34,4,68);
  });
  x.textAlign='left';x.fillStyle='#5f6b82';x.font='12px system-ui';
  x.fillText('Tap when each circle reaches the line. Green bar = on time. Left of a circle = early.',8,14);
}
/* ---- wave engine ---- */
const WV={x:110,scroll:220,H:240,vs:{big:170,mini:210}};
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const KINDS={
  straight:{name:'Straight spam',desc:'Flat corridor: pure speed and evenness.'},
  bias:{name:'Diagonal spam',desc:'Corridor slopes up and down: steer with uneven gaps.'},
  stairs:{name:'Staircase spam',desc:'Corridor steps up and down: re-centre quickly.'},
  sine:{name:'Wavy spam',desc:'Smooth flowing corridor: constant small steering.'},
  pulse:{name:'Tempo-shift spam',desc:'Corridor tightens and loosens: change speed on the fly.'},
  gauntlet:{name:'Gauntlet',desc:'Chains every spam type back to back.'}
};
const GSEQ=['straight','bias','pulse','stairs','sine','pulse','bias'];
function waveGapMin(w){return w.size==='mini'?lerp(64,32,w.diff):lerp(90,36,w.diff);}
function waveNeed(w){return WV.vs[w.size]/(0.6*waveGapMin(w));}
function curKind(t){const w=D.cfg.wave;return w.kind==='gauntlet'?GSEQ[Math.floor(t/5)%GSEQ.length]:w.kind;}
function kindOff(kind,t,df){
  switch(kind){
    case 'bias':{const sl=lerp(8,26,df),A=lerp(25,55,df),P=4*A/sl,ph=(t%P)/P;
      const tri=ph<.25?ph*4:ph<.75?2-ph*4:ph*4-4;return {o:-A*tri,m:1};}
    case 'stairs':{const A=lerp(22,45,df),st=3.2,k=Math.floor(t/st),L=[0,-1,0,1],f=sstep((t/st-k)/0.22);
      const cur=L[k%4],prv=k===0?0:L[(k-1)%4];return {o:A*(prv+(cur-prv)*f),m:1};}
    case 'sine':{const A=lerp(22,48,df),om=lerp(0.5,1.1,df);return {o:A*Math.sin(om*t),m:1};}
    case 'pulse':return {o:0,m:lerp(1,1.7,0.5+0.5*Math.cos(2*Math.PI*t/6))};
    default:return {o:0,m:1};
  }
}
function corr(t){
  const w=D.cfg.wave,df=w.diff;let o,m;
  if(w.kind==='gauntlet'){
    const seg=Math.floor(t/5),k=GSEQ[seg%GSEQ.length],pk=seg?GSEQ[(seg-1)%GSEQ.length]:k;
    const a=kindOff(k,t,df),b=kindOff(pk,t,df),f=sstep((t-seg*5)/0.8);
    o=b.o+(a.o-b.o)*f;m=b.m+(a.m-b.m)*f;
  }else{const a=kindOff(w.kind,t,df);o=a.o;m=a.m;}
  const g=waveGapMin(w)*m*(1+0.9*Math.max(0,1-t/2));
  return {c:clamp(WV.H/2+o,g/2+10,WV.H-g/2-10),g};
}
function waveInit(){
  const w=D.cfg.wave;
  D.data={alive:true,y:0,dir:1,t:0,last:performance.now(),started:true,need:waveNeed(w),off:[],trail:[],vs:WV.vs[w.size]};
  D.data.y=corr(0).c;
  if(w.guide){const iv=1000/w.guide,t0=performance.now();D.data.guide={iv,t0};
    const n=Math.ceil(D.cfg.dur*w.guide)+2;for(let i=1;i<=n;i++)clickAt(t0+i*iv,i%2===0);}
}
function classifyCrash(now){
  const d=D.data,tp=D.taps,rec=tp.slice(-8);
  if(tp.length&&now-tp[tp.length-1].t>600)return 'slow';
  let dbl=0;for(let i=1;i<rec.length;i++)if(rec[i].h===rec[i-1].h)dbl++;
  const ints=[];for(let i=1;i<rec.length;i++)ints.push(rec[i].t-rec[i-1].t);
  const m=avg(ints),cv=ints.length>3?Math.sqrt(avg(ints.map(v=>(v-m)**2)))/m:0;
  if(dbl>=1&&rec.length>4)return 'alt';
  if(cv>0.35)return 'uneven';
  if(liveCps(now)<d.need*0.85)return 'slow';
  return 'steer';
}
function waveStep(now){
  const d=D.data;if(!d.alive)return;
  const dt=Math.min(0.05,(now-d.last)/1000);d.last=now;d.t+=dt;
  d.y+=d.dir*d.vs*dt;
  const c=corr(d.t);
  d.trail.push({t:d.t,y:d.y});while(d.trail.length&&d.trail[0].t<d.t-1.4)d.trail.shift();
  if(Math.abs(d.y-c.c)>c.g/2){
    d.alive=false;d.crashT=d.t;d.crashSide=d.y<c.c?'top':'bottom';d.cause=classifyCrash(now);d.kindAt=curKind(d.t);
    const dd=D;setTimeout(()=>{if(D===dd&&D.state==='run')finish();},600);
  }else if(d.t>=D.cfg.dur){d.alive=false;d.won=true;finish();}
}
function drawWave(x,w,h){
  const d=D.data,cfg=D.cfg,wv=cfg.wave,t=d.started?d.t:0,mini=wv.size==='mini';
  x.fillStyle='#e6eefb';x.fillRect(0,0,w,h);
  x.fillStyle='#1e293b';
  for(let px=0;px<w;px+=3){const tt=t+(px-WV.x)/WV.scroll;if(tt<0){x.fillRect(px,0,3,h);continue;}
    const c=corr(tt);x.fillRect(px,0,3,c.c-c.g/2);x.fillRect(px,c.c+c.g/2,3,h);}
  x.strokeStyle='#64748b';x.lineWidth=2;
  [-1,1].forEach(sg=>{x.beginPath();let first=true;
    for(let px=0;px<w;px+=3){const tt=t+(px-WV.x)/WV.scroll;if(tt<0)continue;const c=corr(tt);const yy=c.c+sg*c.g/2;first?x.moveTo(px,yy):x.lineTo(px,yy);first=false;}x.stroke();});
  const dead=d.alive===false&&!d.won,y=d.started?d.y:corr(0).c,dir=d.dir||1,r=mini?5:9;
  if(d.trail&&d.trail.length>1){x.strokeStyle=dead?'#dc2626':'#2563eb';x.lineWidth=mini?2:3;x.beginPath();
    d.trail.forEach((p,i)=>{const px=WV.x-(t-p.t)*WV.scroll;i?x.lineTo(px,p.y):x.moveTo(px,p.y);});x.stroke();}
  x.fillStyle=dead?'#dc2626':'#2563eb';
  x.beginPath();x.moveTo(WV.x-r,y+dir*r);x.lineTo(WV.x+r,y);x.lineTo(WV.x-r,y-dir*r);x.closePath();x.fill();
  // guide beat
  if(d.guide){const ph=((performance.now()-d.guide.t0)%d.guide.iv)/d.guide.iv,i=Math.floor((performance.now()-d.guide.t0)/d.guide.iv);
    x.globalAlpha=0.35+0.65*(1-ph);x.fillStyle=i%2===0?'#2563eb':'#d97706';x.beginPath();x.arc(w-24,46,12,0,7);x.fill();x.globalAlpha=1;}
  // label bar
  x.fillStyle='rgba(255,255,255,.88)';x.fillRect(0,0,w,22);
  x.fillStyle='#1b2233';x.font='12px system-ui';
  const kn=KINDS[wv.kind].name+(wv.kind==='gauntlet'&&d.started?' · '+KINDS[curKind(t)].name:'');
  x.fillText(`${mini?'MINI':'BIG'} wave · ${kn}${wv.strict?' · strict':''}`,8,15);
  const live=D.state==='run'?liveCps(performance.now()):0,need=waveNeed(wv);
  x.textAlign='right';x.fillStyle=live>=need*0.95?'#16a34a':live>=need*0.8?'#d97706':'#dc2626';
  x.fillText(`need ≈ ${f1(need)} CPS · you ${f1(live)}`,w-8,15);x.textAlign='left';
}

/* ---- finish & results ---- */
function finish(){
  if(!D||D.state==='done')return;
  D.state='done';const cfg=D.cfg;tapHandler=null;
  let taps=D.taps;
  if(cfg.type==='metro')taps=taps.filter(t=>t.t>=D.beats[D.lead]-D.iv*0.6);
  const r=analyze(taps);
  if(cfg.type==='metro'){
    const errs=[...D.data.hits.values()];
    r.metro={hit:errs.length/cfg.beats,mae:avg(errs.map(Math.abs)),bias:avg(errs),extra:D.data.extra};
  }
  if(cfg.type==='wave'){r.survived=D.data.won?cfg.dur:(D.data.crashT||D.data.t||0);updateWave(cfg,r);}
  const _lm=r.lMean,_rm=r.rMean;
  r.score=cfg.type==='wave'?0:scoreOf(r);
  // level evaluation
  let ev=null;
  if(cfg.level){const L=LEVELS.find(l=>l.id===cfg.level);ev=evalLevel(L,r);}
  // persist
  S.sessions.push({d:Date.now(),type:cfg.type,name:cfg.name,cps:+r.cps.toFixed(2),cv:+r.cv.toFixed(3),alt:+r.alt.toFixed(3),
    dbl:r.dbl,drift:+r.drift.toFixed(3),bal:(_lm&&_rm)?+((_rm-_lm)/((_rm+_lm)/2)).toFixed(3):0,cause:r.wave&&r.wave.cause||undefined,kind:cfg.wave&&cfg.wave.kind,size:cfg.wave&&cfg.wave.size,score:Math.round(r.score),hit:r.metro?+r.metro.hit.toFixed(2):undefined,
    mae:r.metro?Math.round(r.metro.mae):undefined,surv:r.survived!==undefined?+r.survived.toFixed(1):undefined,n:r.n});
  if(S.sessions.length>300)S.sessions=S.sessions.slice(-300);
  if(r.n>=5&&r.alt>=0.85&&r.cps>S.best&&cfg.type!=='wave')S.best=r.cps;
  if(!S.days.includes(today()))S.days.push(today());
  let levelMsg='';
  if(ev){
    const st=levelState(cfg.level),L=LEVELS.find(l=>l.id===cfg.level);
    if(st.done){levelMsg='<div class="insight good">Level already complete. This was a practice run.</div>';}
    else if(ev.pass){st.streak++;
      if(st.streak>=L.need){st.done=true;levelMsg=`<div class="insight good"><b>Level complete!</b> You passed ${L.need} in a row.</div>`;}
      else levelMsg=`<div class="insight good">Passed! ${st.streak}/${L.need} in a row needed. Do it again to prove consistency.</div>`;}
    else{st.streak=0;levelMsg='<div class="insight warn">Not quite. Consistency counts, so your in-a-row streak reset. Check the tips below and retry.</div>';}
  }
  save();
  showResult(r,cfg,ev,levelMsg);
  if(D&&D.onDone)D.onDone(r);
}
function evalLevel(L,r){
  const p=L.pass,c=[];
  if(p.cps!==undefined)c.push({t:`Speed ≥ ${p.cps} CPS`,v:f1(r.cps),ok:r.cps>=p.cps});
  if(p.cv!==undefined)c.push({t:`Variation ≤ ${pct(p.cv)}%`,v:pct(r.cv)+'%',ok:r.cv<=p.cv});
  if(p.alt!==undefined)c.push({t:`Alternation ≥ ${pct(p.alt)}%`,v:pct(r.alt)+'%',ok:r.alt>=p.alt});
  if(p.drift!==undefined)c.push({t:`Drift within ±${pct(p.drift)}%`,v:(r.drift>=0?'+':'')+pct(r.drift)+'%',ok:Math.abs(r.drift)<=p.drift});
  if(p.hit!==undefined&&r.metro)c.push({t:`On-beat ≥ ${pct(p.hit)}%`,v:pct(r.metro.hit)+'%',ok:r.metro.hit>=p.hit});
  if(p.mae!==undefined&&r.metro)c.push({t:`Avg timing error ≤ ${p.mae}ms`,v:Math.round(r.metro.mae)+'ms',ok:r.metro.mae<=p.mae});
  if(p.survive!==undefined)c.push({t:`Survive ${p.survive}s`,v:f1(r.survived||0)+'s',ok:(r.survived||0)>=p.survive});
  return {checks:c,pass:c.length>0&&c.every(x=>x.ok)};
}
function showResult(r,cfg,ev,levelMsg){
  const R=$('#result');
  const stat=(l,v)=>`<div class="stat"><span class="mute small">${l}</span><b>${v}</b></div>`;
  let h=`<h3>Results</h3><div class="stats">`;
  h+=stat('Speed',f1(r.cps)+' CPS')+stat('Taps',r.n)+stat('Variation',pct(r.cv)+'%')+stat('Alternation',pct(r.alt)+'%');
  if(r.metro)h+=stat('On-beat',pct(r.metro.hit)+'%')+stat('Timing error',Math.round(r.metro.mae)+'ms');
  if(r.survived!==undefined)h+=stat('Survived',f1(r.survived)+'s');
  if(cfg.type!=='wave')h+=stat('Score',Math.round(r.score)+'/100');
  h+=stat('Drift',(r.drift>=0?'+':'')+pct(r.drift)+'%');
  h+='</div>';
  if(ev){h+='<h3 style="margin-top:14px">Level test</h3><table>'+ev.checks.map(c=>`<tr><td>${c.t}</td><td>${c.v}</td><td class="${c.ok?'ok':'no'}">${c.ok?'✔':'✘'}</td></tr>`).join('')+'</table>'+levelMsg;}
  if(r.wave)h+=waveReport(r,cfg);
  h+='<h3 style="margin-top:14px">Analysis</h3>'+insights(r,cfg).map(i=>`<div class="insight ${i.k}">${i.t}</div>`).join('');
  h+='<h3 style="margin-top:14px">Your rhythm</h3><canvas id="rc" height="160"></canvas>';
  h+='<div class="row" style="margin-top:14px"><button class="primary" id="rRetry">Retry</button>';
  if(D&&D.queue&&D.queue.length)h+='<button class="primary" id="rNext">Next drill ▶</button>';
  if(r.wave)h+='<button class="primary" id="rCoach">Coach\'s next pick ▶</button>';
  h+='<button id="rClose">Close</button></div>';
  R.innerHTML=h;R.classList.add('on');
  $('#pad').style.display='none';$('#dStop').style.display='none';$('#msg').textContent='';
  requestAnimationFrame(()=>drawRhythm(r));
  const cfg0=D.cfg,onDone=D.onDone,queue=D.queue,onQuit=D.onQuit;
  $('#rRetry').onclick=()=>{openDrill(cfg0,onDone);D.queue=queue;D.onQuit=onQuit;};
  if($('#rNext'))$('#rNext').onclick=()=>{runQueue(queue);};
  if($('#rCoach'))$('#rCoach').onclick=()=>{const pk=coachPick();openDrill(pk,null);};
  $('#rClose').onclick=()=>{closeDrill();renderAll();};
  R.scrollIntoView({behavior:'smooth',block:'start'});
}
function drawRhythm(r){
  const c=$('#rc');if(!c)return;const {x,w,h}=fitCanvas(c,160);x.clearRect(0,0,w,h);
  if(!r.ints.length){x.fillStyle='#5f6b82';x.fillText('No data',8,20);return;}
  const max=Math.max(300,...r.ints.map(v=>Math.min(v,600)));
  const px=i=>8+(w-16)*i/Math.max(1,r.ints.length-1),py=v=>h-8-(h-20)*clamp(v/max,0,1);
  x.strokeStyle='#00000033';x.setLineDash([4,4]);x.beginPath();x.moveTo(0,py(r.mean));x.lineTo(w,py(r.mean));x.stroke();x.setLineDash([]);
  x.strokeStyle='#94a3b8';x.beginPath();r.ints.forEach((v,i)=>i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v)));x.stroke();
  r.ints.forEach((v,i)=>{x.fillStyle=r.hands[i+1]===0?'#2563eb':'#d97706';x.beginPath();x.arc(px(i),py(v),3,0,7);x.fill();});
  x.fillStyle='#5f6b82';x.font='11px system-ui';x.fillText(`gap (ms): ${Math.round(r.mean)} avg · ${Math.round(r.sd)} spread · blue=L orange=R`,8,12);
}

/* ---- queue / daily session ---- */
function runQueue(q){
  if(!q||!q.length){closeDrill();renderAll();return;}
  const rest=q.slice(),cfg=rest.shift();
  openDrill(cfg,null);D.queue=rest;
}
function dailyQueue(){
  const best=S.best||4,m=clamp(Math.round(best*0.7),3,8);
  return [
    {type:'free',name:'Warm-up: 8s easy alternate',dur:8},
    {type:'metro',name:`Metronome ${m} CPS`,cps:m,beats:24},
    {type:'free',dur:0,taps:20,name:'Sprint: 20 taps fast'},
    {type:'free',name:'Endurance: 12s',dur:12},
    coachPick()
  ];

function toolMetro(on){
  const btn=$('#tmBtn');
  if(!on){stopMetroTool();if(btn)btn.textContent='Start';return;}
  ac();const cps=+$('#tmCps').value;let i=0;metroNext=performance.now()+100;
  btn.textContent='Stop';
  metroTimer=setInterval(()=>{
    const iv=1000/(+$('#tmCps').value||cps);
    while(metroNext<performance.now()+120){
      clickAt(metroNext,i%2===0);const hh=i%2,delay=Math.max(0,metroNext-performance.now());

      i++;metroNext+=iv;}
  },25);
}

const FLAWS={
 alt:{label:'Double-hits',fix:'Strict-alternation mode: a repeated hand will not flip the wave, so every slip shows up as drift.'},
 uneven:{label:'Uneven rhythm',fix:'A guide beat (audio and visual) paces you at the tempo the corridor needs.'},
 slow:{label:'Speed too low',fix:'Speed ladder: tighter corridors that force faster, smaller zigzags.'},
 fade:{label:'Fading on long runs',fix:'Longer straight holds to build stamina and relaxation.'},
 rush:{label:'Rushing / speeding up',fix:'Guide-beat pulse corridors: hold the tempo while the gap changes.'},
 balance:{label:'Hand imbalance',fix:'Wavy corridors in strict mode, starting with your weaker hand.'},
 steer:{label:'Steering',fix:'Sloped or stair corridors to practise steering with uneven gaps.'},
 tempo:{label:'Tempo changes',fix:'Tempo-shift corridors that tighten and loosen.'},
 mini:{label:'Mini wave',fix:'Extra mini-wave runs at a gentler difficulty.'}
};
const CAUSE={
 alt:'You double-hit shortly before the crash. A repeated hand breaks the see-saw, so the wave keeps going the wrong way.',
 uneven:'Your last few gaps were very uneven, which threw the zigzag off the corridor line.',
 slow:'Your speed dropped below what this corridor needs, so the zigzag grew wider than the gap.',
 steer:'Your rhythm was clean, but the wave drifted off the path. Steer by making the gap in the needed direction a bit longer.'
};
function waveModel(){return S.wave||(S.wave={wl:null,types:{},sizes:{},stars:{},runs:0});}
function waveLevel(){const W=waveModel();if(W.wl===null||W.wl===undefined)W.wl=clamp(((S.best||0)-3)*1.2,0,5);return W.wl;}
function waveTier(){const wl=waveLevel();let t=0;TIERS.forEach((x,i)=>{if(wl>=x.wl)t=i;});return t;}
function tierStars(i){const W=waveModel();return CATALOG.filter(c=>c.tier===i).reduce((a,c)=>a+(W.stars[c.id]||0),0);}
function tierUnlocked(i){if(i===0)return true;if(waveLevel()>=TIERS[i].wl)return true;
  const n=CATALOG.filter(c=>c.tier===i-1).length;return tierStars(i-1)>=Math.ceil(n*3*0.5);}
function updateWave(cfg,r){
  const W=waveModel(),w=cfg.wave,p=clamp(r.survived/cfg.dur,0,1),win=r.survived>=cfg.dur,before=waveLevel();
  const ema=(o,key)=>{const e=o[key]||(o[key]={runs:0,prog:p});e.prog=e.runs?e.prog*0.7+p*0.3:p;e.runs++;};
  ema(W.types,w.kind);ema(W.sizes,w.size);W.runs++;
  const dl=w.diff*10;let delta;
  if(win)delta=dl>=before-1?0.35:0.12;
  else if(p>0.75)delta=0.05;
  else delta=-0.25*(1-p);
  if(!win&&dl>before+1.5)delta=Math.max(delta,-0.05);
  W.wl=clamp(before+delta,0,10);
  let stars=0;if(win){stars=1;if(r.alt>=0.95){stars=2;if(r.cv<=0.3)stars=3;}}
  if(w.id){W.stars[w.id]=Math.max(W.stars[w.id]||0,stars);}
  const d=D.data;
  r.wave={before,after:W.wl,stars,cause:d.cause||null,side:d.crashSide,kindAt:d.kindAt,need:d.need,win};
}
function waveReport(r,cfg){
  const w=r.wave,dl=w.after-w.before;
  let h='<h3 style="margin-top:14px">Wave coach</h3>';
  if(w.win){h+=`<div class="insight good"><b>Cleared!</b>${cfg.wave.id?' '+'★'.repeat(w.stars)+'☆'.repeat(3-w.stars)+' (★ clear · ★★ alternation ≥95% · ★★★ variation ≤30%)':''}</div>`;}
  else{h+=`<div class="insight warn"><b>Crashed into the ${w.side} wall</b>${cfg.wave.kind==='gauntlet'&&w.kindAt?' during the '+KINDS[w.kindAt].name+' section':''}.${w.cause?' '+CAUSE[w.cause]:''}</div>`;}
  h+=`<div class="insight">Wave level ${f1(w.before)} → <b>${f1(w.after)}</b> (${dl>=0?'+':''}${f1(dl)}). The coach uses this to set your next difficulty.</div>`;
  return h;
}
function waveBrief(cfg){
  const w=cfg.wave;let t=`${w.size==='mini'?'Mini':'Big'} wave · ${KINDS[w.kind].name}. Needs about ${f1(waveNeed(w))} CPS. Tap either key to start; every tap flips the wave.`;
  if(w.strict)t+=' Strict mode: a repeated hand will not flip the wave.';
  if(w.guide)t+=` Follow the ${f1(w.guide)} CPS guide beat.`;
  if(w.weak)t+=` Start with your ${w.weak} hand.`;
  if(cfg.why)t+=' '+cfg.why;
  return t;
}
function diagnose(){
  const W=waveModel(),ss=S.sessions.filter(x=>x.n>=8).slice(-10),out={};
  const set=(k,v)=>{if(v>0.2)out[k]=Math.max(out[k]||0,Math.min(1,v));};
  if(ss.length>=2){
    const a=k=>avg(ss.map(x=>x[k]||0));
    set('alt',(0.95-a('alt'))/0.15);set('uneven',(a('cv')-0.18)/0.25);
    set('fade',(a('drift')-0.06)/0.2);set('rush',(-a('drift')-0.08)/0.2);
    set('balance',(Math.abs(a('bal'))-0.06)/0.15);set('slow',(3+waveLevel()*0.6-a('cps'))/3);
  }
  const wr=S.sessions.filter(x=>x.type==='wave'&&x.cause).slice(-12);
  if(wr.length>=2){const c=k=>wr.filter(x=>x.cause===k).length/wr.length;['alt','uneven','slow','steer'].forEach(k=>set(k,c(k)*1.2));}
  const T=W.types;
  if(T.pulse&&T.pulse.runs>=2)set('tempo',(0.7-T.pulse.prog)*2);
  const st=[T.bias,T.stairs].filter(x=>x&&x.runs>=2);if(st.length)set('steer',(0.7-Math.min(...st.map(x=>x.prog)))*2);
  if(W.sizes.mini&&W.sizes.big&&W.sizes.mini.runs>=2)set('mini',(W.sizes.big.prog-W.sizes.mini.prog)*1.5);
  return Object.entries(out).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({k,score:v}));
}
function catalogCfg(c,why){return {type:'wave',name:c.name,dur:c.dur,why,wave:{id:c.id,kind:c.kind,size:c.size,diff:c.diff,mode:'catalog'}};}
function coachPick(){
  const W=waveModel(),fl=diagnose(),wl=waveLevel(),df=clamp(wl/10,0.03,0.97),top=fl[0];
  const ss=S.sessions.filter(x=>x.n>=8).slice(-10);
  const weak=avg(ss.map(x=>x.bal||0))>0?'R':'L';
  const mk=(name,dur,w,k)=>{
    const wv=Object.assign({kind:'straight',size:'big',diff:df,mode:'coach'},w);
    if(w.guide)wv.guide=clamp(Math.round(Math.max(waveNeed(wv)*1.1,3.5)*2)/2,3.5,11);
    let why=`Coach focus: ${FLAWS[k].label}. ${FLAWS[k].fix}`;
    if(fl[1])why+=` (Also watching: ${FLAWS[fl[1].k].label}.)`;
    return {type:'wave',name,dur,why,wave:wv};
  };
  if(!top){
    const next=CATALOG.find(c=>(W.stars[c.id]||0)<1&&tierUnlocked(c.tier));
    if(next)return catalogCfg(next,'No major flaws detected, so the coach is moving you up the Academy. '+next.tip);
    return {type:'wave',name:'Adaptive Gauntlet',dur:Math.round(clamp(20+wl*1.5,20,40)),
      why:'Every challenge cleared and no flaws found. This gauntlet scales with your level.',
      wave:{kind:'gauntlet',size:wl>=4&&Math.random()<0.5?'mini':'big',diff:df,mode:'coach'}};
  }
  switch(top.k){
    case 'alt':return mk('Clean Alternation Lock',14,{diff:Math.min(df,0.4),strict:true},'alt');
    case 'uneven':return mk('Rhythm Guide Straight',16,{diff:Math.min(df,0.5),guide:true},'uneven');
    case 'slow':return mk('Speed Ladder',10,{diff:clamp(df+0.15,0,1)},'slow');
    case 'fade':return mk('Endurance Hold',Math.round(clamp(22+wl*1.5,22,36)),{diff:df*0.8},'fade');
    case 'rush':return mk('Hold the Beat',18,{kind:'pulse',guide:true,diff:Math.min(df,0.5)},'rush');
    case 'balance':return mk(`Weak-Hand Lead (${weak})`,16,{kind:'sine',strict:true,weak,diff:Math.min(df,0.5)},'balance');
    case 'steer':{const T=W.types,b=T.bias?T.bias.prog:1,s2=T.stairs?T.stairs.prog:1;
      return mk('Steering Practice',18,{kind:b<=s2?'bias':'stairs',diff:Math.min(df,0.55)},'steer');}
    case 'tempo':return mk('Tempo Shift Training',18,{kind:'pulse',diff:Math.min(df,0.55)},'tempo');
    case 'mini':return mk('Mini Wave Practice',14,{size:'mini',kind:wl>=3?'sine':'straight',diff:Math.min(df,0.5)*0.8},'mini');
  }
}
function pickChips(c){
  const w=c.wave,chips=[`<span class="chip">${w.size==='mini'?'Mini':'Big'} wave</span>`,`<span class="chip">${KINDS[w.kind].name}</span>`,`<span class="chip">${c.dur}s</span>`,`<span class="chip">needs ≈ ${f1(waveNeed(w))} CPS</span>`];
  if(w.strict)chips.push('<span class="chip">strict alternation</span>');
  if(w.guide)chips.push(`<span class="chip">guide beat ${f1(w.guide)} CPS</span>`);
  if(w.weak)chips.push(`<span class="chip">lead with ${w.weak}</span>`);
  return chips.join('');
}
function renderWave(){
  const W=waveModel(),wl=waveLevel(),fl=diagnose(),pick=coachPick(),tier=waveTier();
  const allStars=CATALOG.length*3,got=CATALOG.reduce((a,c)=>a+(W.stars[c.id]||0),0);
  let h=`<div class="card"><h2>Wave Academy</h2>
   <p class="mute">A wave-spam simulator. Every tap flips the wave up or down, so a steady rhythm keeps it flat and uneven gaps steer it. The coach studies how you fail and builds drills around your weak spots, making the challenges harder as you improve.</p>
   <div class="stats"><div class="stat"><span class="mute small">Wave level</span><b>${f1(wl)}<span class="small mute">/10</span></b></div>
   <div class="stat"><span class="mute small">Tier</span><b>${TIERS[tier].name}</b></div>
   <div class="stat"><span class="mute small">Stars</span><b>${got}/${allStars}</b></div>
   <div class="stat"><span class="mute small">Wave runs</span><b>${W.runs}</b></div></div></div>`;
  h+=`<div class="card"><h3>Coach's diagnosis</h3>`;
  if(fl.length)h+=fl.slice(0,4).map(f=>`<div class="flaw"><div class="row"><b>${FLAWS[f.k].label}</b><span class="space"></span><span class="mute small">${f.score>0.66?'major':f.score>0.4?'moderate':'minor'}</span></div><div class="bar"><i style="width:${Math.round(f.score*100)}%"></i></div><div class="small mute">${FLAWS[f.k].fix}</div></div>`).join('');
  else h+='<p class="mute">No flaws detected yet. Play a few runs (or any drills) and the coach will learn your habits.</p>';
  h+=`<h3 style="margin-top:14px">Next up: ${pick.name}</h3><div>${pickChips(pick)}</div><p class="small mute">${pick.why||''}</p>
   <button class="primary" id="wCoach">▶ Start coach's pick</button></div>`;
  const kinds=Object.keys(KINDS).filter(k=>W.types[k]);
  if(kinds.length){h+='<div class="card"><h3>Your spam-type profile</h3>'+kinds.map(k=>`<div class="flaw"><div class="row"><b>${KINDS[k].name}</b><span class="space"></span><span class="mute small">${Math.round(W.types[k].prog*100)}% avg clear · ${W.types[k].runs} runs</span></div><div class="bar"><i style="width:${Math.round(W.types[k].prog*100)}%;background:var(--good)"></i></div></div>`).join('')+'</div>';}
  TIERS.forEach((T,i)=>{
    const un=tierUnlocked(i),items=CATALOG.filter(c=>c.tier===i);
    h+=`<h3 style="margin:18px 0 8px">Tier ${i+1}: ${T.name} ${un?'':'<span class="tag lock">locked</span>'} <span class="small mute">${tierStars(i)}/${items.length*3}★</span></h3>`;
    if(!un)h+=`<p class="small mute">Unlocks at wave level ${T.wl} or with ${Math.ceil(CATALOG.filter(c=>c.tier===i-1).length*1.5)}★ in the tier above.</p>`;
    h+='<div class="grid">'+items.map(c=>{
      const st=W.stars[c.id]||0,need=waveNeed(c);
      return `<div class="card lvl ${un?'':'locked'}"><div class="row"><b>${c.name}</b><span class="space"></span><span class="tag ${c.size==='mini'?'mini':''}">${c.size}</span></div>
      <p class="small mute" style="margin:4px 0">${KINDS[c.kind].name} · ${c.dur}s · needs ≈ ${f1(need)} CPS</p>
      <p class="small mute" style="margin:4px 0">${c.tip}</p>
      <div class="row"><span style="color:#d97706;font-size:18px">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span><span class="space"></span><button class="primary" data-w="${c.id}" ${un?'':'disabled'}>Play</button></div></div>`;}).join('')+'</div>';
  });
  h+=`<div class="card" style="margin-top:18px"><h3>Custom challenge</h3><div class="row">
   <label>Type <select id="cuK">${Object.keys(KINDS).map(k=>`<option value="${k}">${KINDS[k].name}</option>`).join('')}</select></label>
   <label>Size <select id="cuS"><option>big</option><option>mini</option></select></label>
   <label>Seconds <select id="cuD">${[10,15,20,30,45].map(v=>`<option ${v===20?'selected':''}>${v}</option>`).join('')}</select></label></div>
   <div class="row" style="margin-top:8px"><label style="flex:1">Difficulty <b id="cuL">50</b>%<input id="cuF" type="range" min="0" max="100" value="50"></label>
   <label><input type="checkbox" id="cuX"> strict</label><label><input type="checkbox" id="cuG"> guide beat</label><button class="primary" id="cuGo">Start</button></div></div>`;
  $('#view-wave').innerHTML=h;
  $('#wCoach').onclick=()=>openDrill(pick,null);
  $('#view-wave').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const c=CATALOG.find(x=>x.id===b.dataset.w);openDrill(catalogCfg(c,c.tip),null);});
  $('#cuF').oninput=()=>$('#cuL').textContent=$('#cuF').value;
  $('#cuGo').onclick=()=>{
    const w={kind:$('#cuK').value,size:$('#cuS').value,diff:+$('#cuF').value/100,strict:$('#cuX').checked,mode:'custom'};
    if($('#cuG').checked)w.guide=clamp(Math.round(Math.max(waveNeed(w)*1.1,3.5)*2)/2,3.5,11);
    openDrill({type:'wave',name:`Custom: ${KINDS[w.kind].name} (${w.size})`,dur:+$('#cuD').value,wave:w},null);};
}

/* ============================== boot ============================== */
bindPad();renderNav();go('path');
window.addEventListener('resize',()=>{if(D&&D.state==='done')drawRhythm(analyze(D.taps));});
</script>
